<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ntfy Chat">
<meta name="theme-color" content="#313338">
<title>ntfy Chat</title>
<link rel="manifest" id="manifest-link">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: #1c1d21;
    color: #dbdee1;
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    overscroll-behavior: none;
  }
  #app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(88,101,242,.16), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(235,69,158,.10), transparent 55%),
      #1c1d21;
  }

  /* Header */
  header {
    flex: 0 0 auto;
    background: rgba(30, 31, 36, .85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,.06);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
    z-index: 5;
    position: relative;
  }
  header::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(88,101,242,.6), rgba(235,69,158,.5), transparent);
  }
  header .hash {
    color: #fff; font-size: 15px; font-weight: 800;
    width: 30px; height: 30px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #5865f2, #8b5cf6);
    box-shadow: 0 2px 8px rgba(88,101,242,.4);
    flex: 0 0 auto;
  }
  header .topic-name {
    font-weight: 800; font-size: 16px;
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: linear-gradient(90deg, #f2f3f5, #cdd0f2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header .status-dot {
    width: 9px; height: 9px; border-radius: 50%; background: #6b6f76; flex: 0 0 auto;
    transition: background .3s, box-shadow .3s;
  }
  header .status-dot.live {
    background: #23d18b;
    box-shadow: 0 0 0 3px rgba(35,209,139,.18), 0 0 10px rgba(35,209,139,.6);
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 0 3px rgba(35,209,139,.18), 0 0 10px rgba(35,209,139,.6); }
    50% { box-shadow: 0 0 0 5px rgba(35,209,139,.1), 0 0 14px rgba(35,209,139,.8); }
  }
  header button.icon-btn {
    background: rgba(255,255,255,.05); border: none; color: #d3d5db; font-size: 16px; padding: 7px;
    width: 32px; height: 32px;
    border-radius: 9px; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
  }
  header button.icon-btn:active { background: rgba(255,255,255,.14); transform: scale(.92); }

  /* Messages */
  #messages {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.15) transparent;
  }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 6px; }

  .empty-state {
    margin: auto;
    text-align: center;
    color: #80848e;
    padding: 30px;
  }
  .empty-state .es-icon { font-size: 34px; margin-bottom: 10px; }
  .empty-state .es-title { font-weight: 800; color: #d3d5db; font-size: 15px; margin-bottom: 4px; }
  .empty-state .es-sub { font-size: 13px; }

  #messages .day-sep {
    text-align: center;
    margin: 16px 0 10px;
  }
  #messages .day-sep span {
    color: #9195a0;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .04em;
    background: rgba(255,255,255,.06);
    padding: 4px 12px;
    border-radius: 20px;
  }

  .msg-row {
    display: flex;
    gap: 8px;
    padding: 2px 4px;
    margin-top: 10px;
    animation: msg-in .18s ease-out;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-row.grouped { margin-top: 2px; }
  .msg-row.own { flex-direction: row-reverse; }

  .avatar-slot { flex: 0 0 auto; width: 34px; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 13px;
    box-shadow: 0 2px 6px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.12);
  }

  .msg-col { display: flex; flex-direction: column; max-width: 74%; min-width: 0; }
  .msg-row.own .msg-col { align-items: flex-end; }

  .msg-meta { display: flex; align-items: baseline; gap: 7px; padding: 0 4px 3px; }
  .msg-row.own .msg-meta { flex-direction: row-reverse; }
  .msg-name { font-weight: 800; font-size: 13px; color: #d3d5db; }
  .msg-time { font-size: 10.5px; color: #80848e; }

  .bubble {
    background: #2c2e34;
    border: 1px solid rgba(255,255,255,.05);
    border-radius: 16px;
    border-top-left-radius: 5px;
    padding: 9px 13px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .msg-row.own .bubble {
    background: linear-gradient(135deg, #5865f2, #7d5cf0);
    border: none;
    border-top-left-radius: 16px;
    border-top-right-radius: 5px;
    box-shadow: 0 3px 12px rgba(88,101,242,.35);
  }
  .bubble.img-only { padding: 4px; }

  .msg-text {
    font-size: 14.5px; line-height: 1.42; color: #e3e4e8;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg-row.own .msg-text { color: #fff; }
  .msg-img {
    max-width: min(260px, 62vw);
    max-height: 260px;
    border-radius: 12px;
    display: block;
    cursor: zoom-in;
  }
  .bubble:not(.img-only) .msg-img { margin-top: 8px; }
  .system-note { text-align: center; color: #80848e; font-size: 12.5px; margin: 10px 0; }

  /* Composer */
  #composer-wrap {
    flex: 0 0 auto;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.15) 40%);
    padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
  }
  #preview-strip {
    display: none;
    align-items: center;
    gap: 8px;
    background: #26282e;
    border: 1px solid rgba(255,255,255,.06);
    border-bottom: none;
    border-radius: 14px 14px 0 0;
    padding: 8px 10px;
    margin: 0 0 -4px;
  }
  #preview-strip.show { display: flex; }
  #preview-strip img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
  #preview-strip .pv-info { flex: 1; font-size: 12px; color: #b5bac1; }
  #preview-strip button { background: #4e5058; border: none; color: #fff; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; }
  #composer {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #2c2e34;
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 22px;
    padding: 6px 6px 6px 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    transition: border-color .15s, box-shadow .15s;
  }
  #composer:focus-within {
    border-color: rgba(88,101,242,.6);
    box-shadow: 0 4px 16px rgba(0,0,0,.3), 0 0 0 3px rgba(88,101,242,.15);
  }
  #composer button.attach {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.06);
    color: #dbdee1;
    font-size: 16px;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  #composer button.attach:active { transform: scale(.9); background: rgba(255,255,255,.12); }
  #composer input[type="text"] {
    flex: 1 1 auto;
    background: transparent;
    border: none;
    outline: none;
    color: #f2f3f5;
    font-size: 15px;
    font-family: inherit;
    padding: 8px 4px;
    min-width: 0;
  }
  #composer input[type="text"]::placeholder { color: #80848e; }
  #composer button.send {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #5865f2, #8b5cf6);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(88,101,242,.45);
    transition: transform .1s, opacity .15s;
  }
  #composer button.send:active { transform: scale(.9); }
  #composer button.send:disabled { background: #4e5058; color: #80848e; box-shadow: none; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10,10,14,.65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #26282e;
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 18px;
    padding: 22px 20px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    animation: modal-in .18s ease-out;
  }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(10px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-box h2 {
    margin: 0 0 6px; font-size: 19px;
    background: linear-gradient(90deg, #f2f3f5, #cdd0f2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .modal-box p { margin: 0 0 14px; font-size: 13px; color: #9195a0; line-height: 1.4; }
  .modal-box input[type="text"] {
    width: 100%;
    background: #1c1d21;
    border: 1px solid rgba(255,255,255,.08);
    color: #f2f3f5;
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    margin-bottom: 12px;
    transition: border-color .15s, box-shadow .15s;
  }
  .modal-box input[type="text"]:focus { border-color: #5865f2; box-shadow: 0 0 0 3px rgba(88,101,242,.15); }
  .modal-box .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .modal-box button {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: transform .1s, opacity .15s;
  }
  .modal-box button:active { transform: scale(.96); }
  .modal-box button.primary { background: linear-gradient(135deg, #5865f2, #8b5cf6); color: #fff; box-shadow: 0 3px 10px rgba(88,101,242,.4); }
  .modal-box button.secondary { background: rgba(255,255,255,.05); color: #b5bac1; }

  /* Lightbox */
  #lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 20px;
    animation: fade-in .15s ease-out;
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 10px 50px rgba(0,0,0,.6); }

  #toast {
    position: fixed;
    left: 50%; bottom: 90px;
    transform: translateX(-50%) translateY(6px);
    background: #26282e;
    border: 1px solid rgba(255,255,255,.08);
    color: #f2f3f5;
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 70;
    max-width: 85vw;
    text-align: center;
    box-shadow: 0 6px 24px rgba(0,0,0,.4);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="hash">#</span>
    <span class="topic-name" id="topicNameLabel">chat</span>
    <span class="status-dot" id="statusDot"></span>
    <button class="icon-btn" id="settingsBtn" title="Change room / name">⚙️</button>
  </header>

  <div id="messages"></div>

  <div id="composer-wrap">
    <div id="preview-strip">
      <img id="previewImg" alt="preview">
      <div class="pv-info" id="previewInfo">image.jpg</div>
      <button id="previewRemove">✕</button>
    </div>
    <form id="composer">
      <button type="button" class="attach" id="attachBtn">📎</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <input type="text" id="textInput" placeholder="Message #chat" autocomplete="off">
      <button type="submit" class="send" id="sendBtn">➤</button>
    </form>
  </div>
</div>

<div class="modal-overlay" id="joinModal">
  <div class="modal-box">
    <h2>Join a chat</h2>
    <p>Pick a room to chat in and how you want to be seen. Anyone who knows the room name can read and post — it's a public ntfy topic.</p>
    <input type="text" id="joinRoomInput" maxlength="64" placeholder="Room name">
    <input type="text" id="joinNameInput" maxlength="24" placeholder="Your name">
    <div class="modal-actions">
      <button class="primary" id="joinSaveBtn">Join</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal-box">
    <h2>Room settings</h2>
    <p>Anyone who knows the room name can read and post here — it's a public ntfy topic.</p>
    <input type="text" id="roomInput" maxlength="64" placeholder="Room name">
    <input type="text" id="nameInput2" maxlength="24" placeholder="Your name">
    <div class="modal-actions">
      <button class="secondary" id="settingsCancelBtn">Cancel</button>
      <button class="primary" id="settingsSaveBtn">Save</button>
    </div>
  </div>
</div>

<div id="lightbox"><img id="lightboxImg" alt="full size"></div>
<div id="toast"></div>

<script>
(function() {
  const manifest = {
    name: "ntfy Chat",
    short_name: "ntfyChat",
    description: "Slack-ish chat over a public ntfy topic",
    start_url: "./" + window.location.search,
    display: "standalone",
    background_color: "#313338",
    theme_color: "#313338",
    icons: [
      { src: "icon-192.png", sizes: "192x192", type: "image/png", purpose: "any maskable" },
      { src: "icon-512.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  document.getElementById('manifest-link').href = URL.createObjectURL(blob);
})();

// ---- Config ----
// No hardcoded room — room/name come from ?room=&name= in the URL. If either is
// missing, the join modal asks for both, then writes them into the URL via
// history.replaceState so the resulting link is bookmarkable next time.
const NTFY_BASE = 'https://ntfy.sh';
const MAX_IMAGE_BYTES = 2 * 1024 * 1024; // 2MB
const RECENT_COUNT = 10;

const urlParams = new URLSearchParams(window.location.search);
let room = urlParams.get('room') || '';
let myName = urlParams.get('name') || '';

function syncUrlParams() {
  const params = new URLSearchParams();
  if (room) params.set('room', room);
  if (myName) params.set('name', myName);
  const newUrl = `${window.location.pathname}?${params.toString()}`;
  history.replaceState(null, '', newUrl);
}

// ---- DOM ----
const messagesEl = document.getElementById('messages');
const topicNameLabel = document.getElementById('topicNameLabel');
const statusDot = document.getElementById('statusDot');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const composer = document.getElementById('composer');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const previewStrip = document.getElementById('preview-strip');
const previewImg = document.getElementById('previewImg');
const previewInfo = document.getElementById('previewInfo');
const previewRemove = document.getElementById('previewRemove');
const joinModal = document.getElementById('joinModal');
const joinRoomInput = document.getElementById('joinRoomInput');
const joinNameInput = document.getElementById('joinNameInput');
const joinSaveBtn = document.getElementById('joinSaveBtn');
const settingsBtn = document.getElementById('settingsBtn');
const settingsModal = document.getElementById('settingsModal');
const roomInput = document.getElementById('roomInput');
const nameInput2 = document.getElementById('nameInput2');
const settingsSaveBtn = document.getElementById('settingsSaveBtn');
const settingsCancelBtn = document.getElementById('settingsCancelBtn');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const toast = document.getElementById('toast');

let pendingFile = null;
let pendingBlob = null;
let eventSource = null;
const seenIds = new Set();
let lastDayLabel = '';
let lastSender = null;
let lastSenderTime = 0;
const GROUP_WINDOW_SECONDS = 300;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2600);
}

function hashColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
  const hue = Math.abs(h) % 360;
  return `linear-gradient(135deg, hsl(${hue}, 70%, 55%), hsl(${(hue + 45) % 360}, 65%, 40%))`;
}

function initials(name) {
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function dayLabel(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
}

function maybeInsertDaySeparator(ts) {
  const label = dayLabel(ts);
  if (label !== lastDayLabel) {
    lastDayLabel = label;
    lastSender = null; // don't group messages across a day break
    const sep = document.createElement('div');
    sep.className = 'day-sep';
    const inner = document.createElement('span');
    inner.textContent = label;
    sep.appendChild(inner);
    messagesEl.appendChild(sep);
  }
}

function clearEmptyState() {
  const el = messagesEl.querySelector('.empty-state');
  if (el) el.remove();
}

function showEmptyState() {
  const el = document.createElement('div');
  el.className = 'empty-state';
  el.innerHTML = `
    <div class="es-icon">💬</div>
    <div class="es-title">No messages yet</div>
    <div class="es-sub">Say hi to get things started</div>
  `;
  messagesEl.appendChild(el);
}

function isNearBottom() {
  return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function decodeHeaderValue(v) {
  if (!v) return v;
  try { return decodeURIComponent(v); } catch (e) { return v; }
}

function renderMessage(m) {
  if (!m || m.event !== 'message') return;
  if (seenIds.has(m.id)) return;
  seenIds.add(m.id);

  clearEmptyState();
  const wasNearBottom = isNearBottom();
  maybeInsertDaySeparator(m.time);

  const name = decodeHeaderValue(m.title) || 'anon';
  const isOwn = !!myName && name === myName;
  const grouped = name === lastSender && (m.time - lastSenderTime) < GROUP_WINDOW_SECONDS;
  lastSender = name;
  lastSenderTime = m.time;

  const row = document.createElement('div');
  row.className = 'msg-row' + (isOwn ? ' own' : '') + (grouped ? ' grouped' : '');

  if (!isOwn) {
    const avatarSlot = document.createElement('div');
    avatarSlot.className = 'avatar-slot';
    if (!grouped) {
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.style.background = hashColor(name);
      avatar.textContent = initials(name);
      avatarSlot.appendChild(avatar);
    }
    row.appendChild(avatarSlot);
  }

  const col = document.createElement('div');
  col.className = 'msg-col';

  if (!grouped) {
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    if (!isOwn) {
      const nameEl = document.createElement('span');
      nameEl.className = 'msg-name';
      nameEl.textContent = name;
      meta.appendChild(nameEl);
    }
    const timeEl = document.createElement('span');
    timeEl.className = 'msg-time';
    timeEl.textContent = fmtTime(m.time);
    meta.appendChild(timeEl);
    col.appendChild(meta);
  }

  const hasAttachment = m.attachment && m.attachment.url;
  const hasImage = hasAttachment && (m.attachment.type || '').startsWith('image');

  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (hasImage && !m.message ? ' img-only' : '');

  if (m.message) {
    // Plain text posts send the raw body as-is; image captions are sent via the
    // "Message" header, which ntfy does not URL-decode server-side, so only
    // those need decoding here.
    const textEl = document.createElement('div');
    textEl.className = 'msg-text';
    textEl.textContent = hasAttachment ? decodeHeaderValue(m.message) : m.message;
    bubble.appendChild(textEl);
  }

  if (hasImage) {
    const img = document.createElement('img');
    img.className = 'msg-img';
    img.src = m.attachment.url;
    img.loading = 'lazy';
    img.addEventListener('click', () => {
      lightboxImg.src = m.attachment.url;
      lightbox.classList.add('show');
    });
    bubble.appendChild(img);
  }

  col.appendChild(bubble);
  row.appendChild(col);
  messagesEl.appendChild(row);

  if (wasNearBottom) scrollToBottom();
}

function renderSystemNote(text) {
  const el = document.createElement('div');
  el.className = 'system-note';
  el.textContent = text;
  messagesEl.appendChild(el);
  scrollToBottom();
}

// ---- Loading recent + live stream ----
async function loadRecent() {
  messagesEl.innerHTML = '';
  seenIds.clear();
  lastDayLabel = '';
  lastSender = null;
  lastSenderTime = 0;
  try {
    const res = await fetch(`${NTFY_BASE}/${encodeURIComponent(room)}/json?poll=1&since=all`);
    const text = await res.text();
    const lines = text.trim().split('\n').filter(Boolean);
    const msgs = lines.map(l => { try { return JSON.parse(l); } catch (e) { return null; } })
      .filter(m => m && m.event === 'message');
    const recent = msgs.slice(-RECENT_COUNT);
    if (!recent.length) {
      showEmptyState();
    } else {
      recent.forEach(renderMessage);
    }
    scrollToBottom();
  } catch (e) {
    renderSystemNote('Could not load recent messages.');
  }
}

function connectStream() {
  if (eventSource) eventSource.close();
  statusDot.classList.remove('live');
  eventSource = new EventSource(`${NTFY_BASE}/${encodeURIComponent(room)}/sse`);
  eventSource.onopen = () => statusDot.classList.add('live');
  eventSource.onerror = () => statusDot.classList.remove('live');
  eventSource.onmessage = (e) => {
    try {
      const m = JSON.parse(e.data);
      renderMessage(m);
    } catch (err) { /* ignore keepalive/non-json */ }
  };
}

function switchRoom(newRoom) {
  room = newRoom;
  localStorage.setItem('ntfychat_room', room);
  syncUrlParams();
  topicNameLabel.textContent = room;
  textInput.placeholder = `Message #${room}`;
  loadRecent();
  connectStream();
}

// ---- Sending ----
async function sendText(text) {
  await fetch(`${NTFY_BASE}/${encodeURIComponent(room)}`, {
    method: 'POST',
    body: text,
    headers: {
      'Title': encodeURIComponent(myName),
      'Content-Type': 'text/plain; charset=utf-8'
    }
  });
}

async function sendImage(blob, filename, caption) {
  const headers = {
    'Title': encodeURIComponent(myName),
    'Filename': filename || 'image.jpg',
    'Content-Type': blob.type || 'image/jpeg'
  };
  if (caption) headers['Message'] = encodeURIComponent(caption);
  await fetch(`${NTFY_BASE}/${encodeURIComponent(room)}`, {
    method: 'PUT',
    body: blob,
    headers
  });
}

function loadImageEl(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

async function compressImage(file, maxBytes) {
  if (file.size <= maxBytes) return file;
  const { img, url } = await loadImageEl(file);
  let width = img.naturalWidth;
  let height = img.naturalHeight;
  const maxDim = 1920;
  let scale = Math.max(width, height) > maxDim ? maxDim / Math.max(width, height) : 1;
  let quality = 0.85;
  let blob = file;

  for (let attempt = 0; attempt < 8; attempt++) {
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(width * scale));
    canvas.height = Math.max(1, Math.round(height * scale));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
    if (!blob) break;
    if (blob.size <= maxBytes) break;
    if (quality > 0.45) quality -= 0.15;
    else scale *= 0.75;
  }
  URL.revokeObjectURL(url);
  return blob;
}

// ---- UI wiring ----
function openPreview(file) {
  pendingFile = file;
  previewImg.src = URL.createObjectURL(file);
  previewInfo.textContent = `${file.name || 'image'} · ${(file.size / 1024 / 1024).toFixed(1)}MB`;
  previewStrip.classList.add('show');
}

function clearPreview() {
  pendingFile = null;
  pendingBlob = null;
  fileInput.value = '';
  previewStrip.classList.remove('show');
}

attachBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) openPreview(file);
});

previewRemove.addEventListener('click', clearPreview);

composer.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = textInput.value.trim();
  const file = pendingFile;

  if (!text && !file) return;

  sendBtn.disabled = true;
  try {
    if (file) {
      previewInfo.textContent = 'Sending…';
      let blob = file;
      if (file.size > MAX_IMAGE_BYTES) {
        blob = await compressImage(file, MAX_IMAGE_BYTES);
        showToast(`Image compressed from ${(file.size/1024/1024).toFixed(1)}MB to ${(blob.size/1024/1024).toFixed(1)}MB`);
      }
      await sendImage(blob, file.name, text);
      clearPreview();
    } else {
      await sendText(text);
    }
    textInput.value = '';
  } catch (err) {
    showToast('Failed to send. Check your connection.');
  } finally {
    sendBtn.disabled = false;
  }
});

lightbox.addEventListener('click', () => lightbox.classList.remove('show'));

// join modal — shown whenever the URL is missing a room and/or a name
function needsJoin() {
  return !room || !myName;
}

function enterChat() {
  topicNameLabel.textContent = room;
  textInput.placeholder = `Message #${room}`;
  loadRecent();
  connectStream();
}

function ensureJoined() {
  if (!needsJoin()) {
    enterChat();
    return;
  }
  joinRoomInput.value = room || localStorage.getItem('ntfychat_room') || '';
  joinNameInput.value = myName || localStorage.getItem('ntfychat_name') || '';
  joinModal.classList.add('show');
  (joinRoomInput.value ? joinNameInput : joinRoomInput).focus();
}

function submitJoin() {
  const r = joinRoomInput.value.trim();
  const n = joinNameInput.value.trim();
  if (!r || !n) { showToast('Room and name are both required'); return; }
  room = r;
  myName = n;
  localStorage.setItem('ntfychat_room', room);
  localStorage.setItem('ntfychat_name', myName);
  syncUrlParams();
  joinModal.classList.remove('show');
  enterChat();
}
joinSaveBtn.addEventListener('click', submitJoin);
joinRoomInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitJoin(); });
joinNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitJoin(); });

// settings modal
settingsBtn.addEventListener('click', () => {
  roomInput.value = room;
  nameInput2.value = myName;
  settingsModal.classList.add('show');
});
settingsCancelBtn.addEventListener('click', () => settingsModal.classList.remove('show'));
settingsSaveBtn.addEventListener('click', () => {
  const newRoom = roomInput.value.trim();
  const newName = nameInput2.value.trim();
  if (!newRoom || !newName) { showToast('Room and name are both required'); return; }
  myName = newName;
  localStorage.setItem('ntfychat_name', myName);
  settingsModal.classList.remove('show');
  if (newRoom !== room) {
    switchRoom(newRoom);
  } else {
    syncUrlParams();
  }
});

// ---- Init ----
ensureJoined();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (!eventSource || eventSource.readyState === 2) connectStream();
  }
});
</script>
